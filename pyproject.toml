[project]
name = "jarvis"
version = "0.1.0"
description = "Asistente personal inteligente construido para Bau."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.17.0",
    "pyaudio>=0.2.14",
    "python-dotenv>=1.2.2",
]

[project.scripts]
jarvis = "jarvis.main:run"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
