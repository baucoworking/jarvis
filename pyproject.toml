[project]
name = "jarvis"
version = "0.3.0"
description = "Asistente personal inteligente construido por y para Bau."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=2.17.0",
    "onnxruntime>=1.28.0",
    "openwakeword>=0.6.0",
    "pyaudio>=0.2.14",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "setuptools<82",
    "tqdm>=4.70.0",
]

[project.scripts]
jarvis = "jarvis.main:run"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
exclude-dependencies = ["tflite-runtime"]